# Build artifacts: the server's Docker image and the Android APKs.
# Tests live in ci.yml; this workflow only packages.
#
# Android release signing is optional — configure two repo secrets to enable:
#   ANDROID_KEYSTORE_BASE64    base64 of android/keystore/marusic-release.keystore
#   ANDROID_KEYSTORE_PASSWORD  the store/key password from android/keystore.properties
# Without them the job still uploads an installable debug APK.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Publishes ghcr.io/marwansummakieh/marusic, which is what docker-compose.yml
  # pulls. A NAS never builds this itself: it has no toolchain, and emulating an
  # arm64 npm install on a two-core Celeron is not a thing anyone should wait for.
  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # QEMU, for the arm64 half of the manifest. Most NAS boxes that are not
      # x86 Synology/QNAP are ARM, and an amd64-only image fails on them with
      # "no matching manifest" — which is exactly the error that makes a
      # published image useless to the person it was published for.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Two moving tags and the pinnable ones:
      #   latest        the newest v* release   — what compose defaults to
      #   1.4.2 / 1.4   that release, pinned    — MARUSIC_TAG=1.4 in .env
      #   edge, main    the tip of main         — for trying a fix before a tag
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=ref,event=branch
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without a cache every push re-runs the emulated arm64 `npm ci`.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations add unknown/unknown entries to the manifest list that
          # the older Docker on DSM 7 / QTS reads as a platform it cannot match.
          # A NAS that cannot pull the image is a worse trade than provenance.
          provenance: false

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build signed release APK (needs keystore secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret - skipping signed release build."
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/marusic-release.keystore
          {
            echo "storeFile=keystore/marusic-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=marusic"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: marusic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
        with:
          name: marusic-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
