<!doctype html>

<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0b0712; color: #fff; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
    a { color: #f0559d; } a:hover { color: #9b6cf5; }
    .phone { width: 390px; height: 844px; background: #0b0712; overflow: hidden; position: relative; display: flex; flex-direction: column; }
    .icon { width: 24px; height: 24px; flex: none; }
    .icon path, .icon circle, .icon rect { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon .fill { fill: currentColor; stroke: none; }
  </style>
</helmet>
<div class="phone">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 300px; background: radial-gradient(120% 60% at 50% -12%, rgba(240, 85, 157, .22), rgba(155, 108, 245, .10) 48%, transparent 75%); pointer-events: none;"></div>

      <div style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #f0559d, #9b6cf5); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #14091d;">M</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 6px 16px 4px; position: relative;">
    <div style="display: flex; flex-direction: column; gap: 22px; padding: 16px 14px; border-radius: 12px; background: #1d1430; border: 1px solid rgba(255, 255, 255, .07);">
      <svg class="icon" viewBox="0 0 24 24" style="color: #f0559d;"><path d="M9 18.5V6l10-2v12.5"/><circle cx="6.8" cy="18.5" r="2.4"/><circle cx="16.8" cy="16.5" r="2.4"/></svg>
      <span style="font-size: 15px; font-weight: 700; line-height: 1.25;">New releases</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 22px; padding: 16px 14px; border-radius: 12px; background: #1d1430; border: 1px solid rgba(255, 255, 255, .07);">
      <svg class="icon" viewBox="0 0 24 24" style="color: #9b6cf5;"><path d="m3.5 16.5 6-6 4 4 7-7"/><path d="M14.5 7.5h6v6"/></svg>
      <span style="font-size: 15px; font-weight: 700; line-height: 1.25;">Charts</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 22px; padding: 16px 14px; border-radius: 12px; background: #1d1430; border: 1px solid rgba(255, 255, 255, .07);">
      <svg class="icon" viewBox="0 0 24 24" style="color: #f0559d;"><circle cx="12" cy="12" r="8.5"/><path d="M9 10h.01M15 10h.01"/><path d="M8.5 14.2a4.5 4.5 0 0 0 7 0"/></svg>

  </div>

  <div style="padding: 20px 16px 0; position: relative;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
      <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">New albums &amp; singles</div>
      <svg class="icon" viewBox="0 0 24 24" style="width: 20px; height: 20px; color: #b6a8c9;"><path d="m9 5 7 7-7 7"/></svg>
    </div>
    <div style="display: flex; gap: 12px;">
      <div style="flex: 1; min-width: 0;">
        <div style="height: 172px; border-radius: 10px; background: radial-gradient(80% 80% at 50% 45%, #5c1230, #1c0512 85%); display: flex; align-items: center; justify-content: center;">
          <svg class="icon" viewBox="0 0 24 24" style="width: 44px; height: 44px; color: rgba(240, 85, 157, .55);"><path d="M9 18.5V6l10-2v12.5"/><circle cx="6.8" cy="18.5" r="2.4"/><circle cx="16.8" cy="16.5" r="2.4"/></svg>
        </div>
        <div style="font-size: 15px; font-weight: 700; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Valse Funèbre</div>
        <div style="font-size: 13px; color: #b6a8c9;">Single • Alexis DL</div>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="height: 172px; border-radius: 10px; background: linear-gradient(160deg, #33205c, #8d54c9 90%); display: flex; align-items: center; justify-content: center;">
          <svg class="icon" viewBox="0 0 24 24" style="width: 44px; height: 44px; color: rgba(255, 255, 255, .4);"><path d="M9 18.5V6l10-2v12.5"/><circle cx="6.8" cy="18.5" r="2.4"/><circle cx="16.8" cy="16.5" r="2.4"/></svg>
        </div>
        <div style="font-size: 15px; font-weight: 700; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Once There Was Magic</div>
        <div style="font-size: 13px; color: #b6a8c9;">Single • Hecate Music</div>
      </div>
    </div>
  </div>

  <div style="padding: 22px 16px 0; position: relative; flex: 1; min-height: 0;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
      <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">Moods &amp; genres</div>
      <svg class="icon" viewBox="0 0 24 24" style="width: 20px; height: 20px; color: #b6a8c9;"><path d="m9 5 7 7-7 7"/></svg>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="display: flex; align-items: center; height: 52px; border-radius: 8px; background: #1d1430; overflow: hidden;"><span style="width: 6px; align-self: stretch; background: #f0559d; border-radius: 3px; margin: 6px 0 6px 6px;"></span><span style="padding: 0 14px; font-size: 15px; font-weight: 700;">J-Pop</span></div>

      <div style="display: flex; align-items: center; height: 52px; border-radius: 8px; background: #1d1430; overflow: hidden;"><span style="width: 6px; align-self: stretch; background: #d264c4; border-radius: 3px; margin: 6px 0 6px 6px;"></span><span style="padding: 0 14px; font-size: 15px; font-weight: 700;">Feel good</span></div>
      <div style="display: flex; align-items: center; height: 52px; border-radius: 8px; background: #1d1430; overflow: hidden;"><span style="width: 6px; align-self: stretch; background: #7a8cf5; border-radius: 3px; margin: 6px 0 6px 6px;"></span><span style="padding: 0 14px; font-size: 15px; font-weight: 700;">Anime</span></div>
    </div>
  </div>

  <div style="margin: 0 8px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: #1d1430; border: 1px solid rgba(255, 255, 255, .07);">
    <div style="width: 40px; height: 40px; border-radius: 6px; flex: none; background: linear-gradient(140deg, #451a38, #b4407e);"></div>
    <div style="flex: 1; min-width: 0;">
      <div style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Initial D - Deja Vu</div>
      <div style="font-size: 12px; color: #b6a8c9;">Pretty ok</div>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg class="icon" viewBox="0 0 24 24" style="width: 28px; height: 28px;"><path class="fill" d="M8 5.5v13l11-6.5z"/></svg></div>
  </div>

  <div style="display: flex; padding: 8px 8px 14px; background: linear-gradient(180deg, transparent, rgba(11, 7, 18, .9) 30%);">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; color: #8d7fa3;"><svg class="icon" viewBox="0 0 24 24" style="width: 22px; height: 22px;"><path d="M4 11.5 12 4.5l8 7"/><path d="M6 10.5V20h12v-9.5"/></svg><span style="font-size: 11px; font-weight: 600;">Home</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; color: #fff;"><svg class="icon" viewBox="0 0 24 24" style="width: 22px; height: 22px;"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span style="font-size: 11px; font-weight: 600;">Browse</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; color: #8d7fa3;"><svg class="icon" viewBox="0 0 24 24" style="width: 22px; height: 22px;"><path d="M5 4v16M9 4v16"/><path d="m13.5 4.6 4.8 15"/></svg><span style="font-size: 11px; font-weight: 600;">Library</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; color: #8d7fa3;"><svg class="icon" viewBox="0 0 24 24" style="width: 22px; height: 22px;"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.5-3.5 4.3-5 7.5-5s6 1.5 7.5 5"/></svg><span style="font-size: 11px; font-weight: 600;">Profile</span></div>
