# Build artifacts: the server's Docker image and the Android APKs.
# Tests live in ci.yml; this workflow only packages.
#
# Android release signing is optional — configure two repo secrets to enable:
#   ANDROID_KEYSTORE_BASE64    base64 of android/keystore/marusic-release.keystore
#   ANDROID_KEYSTORE_PASSWORD  the store/key password from android/keystore.properties
# Without them the job still uploads an installable debug APK.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      # Every push validates the image builds; tags also push it to GHCR.
      - name: Build (push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build signed release APK (needs keystore secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret - skipping signed release build."
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/marusic-release.keystore
          {
            echo "storeFile=keystore/marusic-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=marusic"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: marusic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
        with:
          name: marusic-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
