<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Marusic</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231ed760'/%3E%3Cstop offset='.5' stop-color='%2300c8ff'/%3E%3Cstop offset='1' stop-color='%23c45cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='12' cy='12' r='12' fill='%230b0b0d'/%3E%3Ccircle cx='12' cy='12' r='8.5' fill='none' stroke='%23ffffff' stroke-opacity='.15' stroke-width='.7'/%3E%3Ccircle cx='12' cy='12' r='5' fill='url(%23g)'/%3E%3Cpath d='M9.4 14.6V9.4L12 12.6 14.6 9.4V14.6' fill='none' stroke='%230b0b0d' stroke-width='1.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-body">
  <div class="auth">
    <div class="auth-card">
      <div class="auth-logo">
        <svg class="brand-record" viewBox="0 0 24 24" width="52" height="52"><defs><linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ed760"/><stop offset=".5" stop-color="#00c8ff"/><stop offset="1" stop-color="#c45cff"/></linearGradient></defs><circle cx="12" cy="12" r="11.5" fill="#0b0b0d"/><circle cx="12" cy="12" r="11.5" fill="none" stroke="url(#logo-grad)" stroke-width="1"/><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width=".5"/><circle cx="12" cy="12" r="7.2" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width=".5"/><circle cx="12" cy="12" r="5.4" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width=".5"/><circle cx="12" cy="12" r="4.4" fill="url(#logo-grad)"/><path d="M9.6 14.4V9.6L12 12.5 14.4 9.6V14.4" fill="none" stroke="#0b0b0d" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <h1>Marusic</h1>
      </div>
      <p class="auth-sub">Members only. Ask Marwan for an invite.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="btn-solid auth-btn" type="submit">Sign In</button>
      </form>
      <div class="auth-err" id="err"></div>
    </div>
  </div>
  <script src="/auth.js"></script>
</body>
</html>
